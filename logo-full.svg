<svg width="400" height="80" viewBox="0 0 400 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55a2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cube Icon -->
  <g transform="translate(10, 10)">
    <!-- Top face -->
    <polygon points="30,10 45,20 30,30 15,20" fill="url(#orangeGrad)" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Left face -->
    <polygon points="15,20 15,40 30,50 30,30" fill="#FF6B35" opacity="0.8" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Right face -->
    <polygon points="30,30 30,50 45,40 45,20" fill="#FF6B35" opacity="0.6" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Inner detail lines -->
    <line x1="30" y1="20" x2="30" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="22.5" y1="25" x2="30" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="37.5" y1="25" x2="30" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Text: Institute of Digital Risk -->
  <text x="75" y="35" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">
    Institute of Digital Risk
  </text>
  
  <!-- Subtitle: IDR -->
  <text x="75" y="55" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FF6B35">
    IDR
  </text>
</svg>
