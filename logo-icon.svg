<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Cube structure representing structure, risk, and resilience -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55a2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main cube structure -->
  <!-- Top face -->
  <polygon points="50,20 75,35 50,50 25,35" fill="url(#orangeGrad)" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Left face -->
  <polygon points="25,35 25,65 50,80 50,50" fill="#FF6B35" opacity="0.8" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Right face -->
  <polygon points="50,50 50,80 75,65 75,35" fill="#FF6B35" opacity="0.6" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Inner detail lines for digital/tech feel -->
  <line x1="50" y1="35" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="37.5" y1="42.5" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="62.5" y1="42.5" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
</svg>
